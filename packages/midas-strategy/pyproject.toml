[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-strategy"
version = "0.1.0"
description = "Midas strategy engine — regime detection, AAA allocator, transaction cost model"
requires-python = ">=3.11"
dependencies = [
    "kailash>=2.6.0",
    "midas-data",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "polars>=1.0",
    "structlog>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
