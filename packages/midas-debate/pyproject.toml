[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-debate"
version = "0.1.0"
description = "Midas debate agent — Kaizen-based grounded AI debate with citation verification"
requires-python = ">=3.11"
dependencies = [
    "kailash>=2.6.0",
    "kailash-kaizen>=2.5.0",
    "kaizen-agents>=0.7.0",
    "midas-data",
    "midas-strategy",
    "midas-backtest",
    "structlog>=23.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
