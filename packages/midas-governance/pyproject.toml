[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-governance"
version = "0.1.0"
description = "Midas governance — PACT envelopes, publisher/subscriber separation, chain-hashed audit trail"
requires-python = ">=3.11"
dependencies = [
    "kailash>=2.6.0",
    "kailash-pact>=0.8.0",
    "kailash-dataflow>=1.8.0",
    "structlog>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
